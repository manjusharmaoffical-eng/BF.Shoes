<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Track your BF SHOES Cash on Delivery order."><meta name="theme-color" content="#111"><title>Track your order · BF SHOES</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f4f3ef;color:#111;font-family:Arial,sans-serif}.track{max-width:680px;margin:8vh auto;padding:24px}.track-card{background:#fff;padding:clamp(22px,5vw,42px);border:1px solid #ddd}.track h1{font-size:clamp(32px,7vw,48px);margin:8px 0 12px;letter-spacing:-.05em}.track p{line-height:1.65;color:#555}.track label{display:block;font-size:12px;margin:17px 0 6px}.track input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc}.track button{margin-top:18px;background:#111;color:#fff;border:0;padding:14px 18px;cursor:pointer}.result{margin-top:20px;padding:18px;background:#f0efe9;white-space:pre-wrap}.hidden{display:none}.track a{color:#111}</style><link rel="stylesheet" href="/brand-pages.css">
</head><body class="brand-page"><main class="track"><a href="/">← BF SHOES</a><section class="track-card"><p class="eyebrow">ORDER SUPPORT / TRACKING</p><h1>Where’s your pair?</h1><p>Enter the order number shown after checkout and the email address used for your order.</p><form id="track-form"><label for="order-number">Order number</label><input id="order-number" name="order_number" inputmode="numeric" pattern="[0-9]{1,18}" required><label for="email">Checkout email</label><input id="email" name="email" type="email" maxlength="254" required><button>Track order ↗</button></form><div id="result" class="result hidden" role="status"></div></section></main><script defer src="/track-order.js"></script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Secure payment | BF SHOES</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f4f4;color:#111;font-family:Arial,Helvetica,sans-serif}
    main{width:min(460px,100%);padding:32px;background:#fff;border:1px solid #e6e6e6;border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.08)}
    .brand{display:inline-flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.12em;text-decoration:none;color:#111}
    .mark{display:grid;place-items:center;width:42px;height:42px;background:#c8102e;color:#fff;font-size:18px;letter-spacing:-.08em}
    .eyebrow{margin:28px 0 8px;color:#c8102e;font-size:10px;font-weight:900;letter-spacing:.18em}
    h1{margin:0;font-size:28px;letter-spacing:-.04em}p{color:#555;font-size:13px;line-height:1.7}
    .secure{margin-top:24px;padding:12px;background:#f7f7f7;border-left:3px solid #c8102e;font-size:11px;color:#444}
  </style>
  <script defer src="/pay.js"></script>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="BF SHOES home"><span class="mark">BF</span><span>BF SHOES</span></a>
    <p class="eyebrow">SECURE PAYMENT</p>
    <h1>Connecting to PayU…</h1>
    <p id="pay-status" role="status" aria-live="polite">Checking your secure BF SHOES payment link. Please keep this page open.</p>
    <div class="secure">Your payment is processed on PayU's secure checkout. BF SHOES never asks for your UPI PIN, card PIN or OTP on this page.</div>
    <form id="pay-form" method="post"></form>
  </main>
</body>
</html>

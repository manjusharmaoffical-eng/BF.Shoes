 <path d="M568 352L646 386L603 455L525 440Z" fill="url(#red)" stroke="#050505" stroke-width="7" stroke-linejoin="round"/>
 <!-- tongue and lace bed -->
 <path d="M326 365L382 248Q398 223 425 236L504 285L453 392L380 414Z" fill="#090909" stroke="#555" stroke-width="6"/>
 <path d="M371 264L470 317M356 289L457 340M342 315L443 364M329 341L426 389" stroke="#d8d8d8" stroke-width="8" stroke-linecap="round"/>
 <path d="M374 262L465 310M359 288L450 337M345 314L436 362" stroke="#e31b2f" stroke-width="3.5" stroke-linecap="round"/>
 <path d="M359 220Q385 190 420 208L453 228" fill="none" stroke="#666" stroke-width="8" stroke-linecap="round"/>

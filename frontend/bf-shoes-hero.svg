 <path d="M224 544L915 543" fill="none" stroke="#e31b2f" stroke-width="7" stroke-linecap="round"/>
 <!-- heel guard and toe overlay -->
 <path d="M146 448Q190 441 240 402L285 377L321 430Q267 472 178 482Z" fill="#111" stroke="#555" stroke-width="5"/>
 <path d="M714 347L862 390Q908 404 944 444L888 465L733 421Z" fill="#0a0a0a" stroke="#555" stroke-width="5"/>
 <path d="M746 367L856 401Q897 415 919 438L857 441L749 408Z" fill="url(#mesh)" stroke="#242424" stroke-width="4"/>

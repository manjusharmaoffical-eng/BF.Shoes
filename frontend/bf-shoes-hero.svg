<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">BF SHOES — signature black and red sneaker</title>
<desc id="desc">Premium black technical sneaker with a bold white BF side mark, red motion stripes and a sculpted black and white sole, rendered in a dramatic studio style.</desc>
<defs>
 <linearGradient id="upper" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#343434"/><stop offset=".34" stop-color="#111"/><stop offset=".72" stop-color="#050505"/><stop offset="1" stop-color="#202020"/></linearGradient>
 <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#454545"/><stop offset=".45" stop-color="#171717"/><stop offset="1" stop-color="#090909"/></linearGradient>
 <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f8f8"/><stop offset=".23" stop-color="#d8d8d8"/><stop offset=".27" stop-color="#292929"/><stop offset="1" stop-color="#030303"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5360"/><stop offset=".5" stop-color="#e31b2f"/><stop offset="1" stop-color="#920717"/></linearGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#e31b2f" stop-opacity=".24"/><stop offset="1" stop-color="#e31b2f" stop-opacity="0"/></radialGradient>
 <pattern id="weave" width="13" height="13" patternUnits="userSpaceOnUse"><path d="M0 2L11 13M-3 5L5 -3M5 16L16 5" stroke="#aaa" stroke-opacity=".14" stroke-width="1.6"/></pattern>
 <filter id="shadow" x="-30%" y="-50%" width="170%" height="210%"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<ellipse cx="620" cy="625" rx="420" ry="45" fill="#000" opacity=".85" filter="url(#shadow)"/>
<ellipse cx="650" cy="600" rx="300" ry="90" fill="url(#halo)" filter="url(#glow)"/>
<g transform="rotate(-6 600 370)">
 <!-- upper silhouette -->
 <path d="M142 436Q199 415 259 350L360 215Q386 184 421 202L558 279Q630 321 715 345L876 389Q926 405 964 444L1000 483Q1015 502 990 520L927 541L250 550Q184 544 142 506Q122 486 126 461Z" fill="url(#upper)" stroke="#050505" stroke-width="12" stroke-linejoin="round"/>

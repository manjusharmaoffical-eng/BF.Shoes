services:
  bf-shoes-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bf-shoes-api:local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
